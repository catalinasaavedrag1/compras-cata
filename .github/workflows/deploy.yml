name: Desplegar a GitHub Pages

# Publica el sitio en la rama gh-pages cada vez que se sube a main.
on:
  push:
    branches: [main]
  workflow_dispatch: # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write # necesario para que la Action pueda actualizar gh-pages

concurrency:
  group: deploy-gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Construir sitio (base /compras-cata/)
        run: npm run build
        env:
          GHPAGES: "true"

      - name: Preparar para GitHub Pages (SPA + .nojekyll)
        run: |
          touch dist/.nojekyll
          cp dist/index.html dist/404.html

      - name: Publicar en gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
